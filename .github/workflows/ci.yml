name: ci

# What has to hold before a change lands: both type checks pass, the share API
# suite passes, and the site builds. There is nothing to package — Vercel builds
# and deploys from the same commit.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck api
        run: pnpm typecheck:api

      - name: Test
        run: pnpm test:share

      - name: Build
        run: pnpm build
